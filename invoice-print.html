<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Facture - Impression</title><style>@media print{@page{size:A4;margin:0}body{margin:0;padding:0}.no-print{display:none!important}}body{font-family:'Arial',sans-serif;margin:0;padding:20px;background:#f5f5f5}.invoice-page{width:210mm;min-height:297mm;background:white;margin:0 auto;padding:20mm;box-shadow:0 0 10px rgba(0,0,0,0.1);position:relative}.header{display:flex;justify-content:space-between;align-items:start;padding-bottom:20px;border-bottom:3px solid #667eea;margin-bottom:30px}.logo{font-size:48px;color:#667eea}.company-info{flex:1}.company-name{font-size:24px;font-weight:bold;color:#1e293b;margin-bottom:5px}.company-details{font-size:12px;color:#64748b;line-height:1.6}.invoice-title{text-align:center;font-size:32px;font-weight:bold;color:#1e293b;margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}.invoice-number{text-align:center;font-size:16px;color:#64748b;margin-bottom:30px}.billing-section{display:grid;grid-template-columns:repeat(2,1fr);gap:30px;margin-bottom:40px}.section-title{font-size:14px;font-weight:bold;color:#64748b;margin-bottom:10px;text-transform:uppercase}.section-content{background:#f8fafc;padding:15px;border-radius:8px}.amount-section{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:30px;border-radius:12px;text-align:center;margin-bottom:40px}.amount-label{font-size:16px;margin-bottom:10px;opacity:0.9}.amount-value{font-size:48px;font-weight:bold}.footer{position:absolute;bottom:20mm;left:20mm;right:20mm;padding-top:20px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}.print-button{position:fixed;top:20px;right:20px;padding:15px 30px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(102,126,234,0.3);z-index:1000}.print-button:hover{background:#5568d3}@media print{body{background:white;padding:0}.invoice-page{box-shadow:none;margin:0;padding:15mm}}</style></head>
<body><button class="print-button no-print" onclick="window.print()">🖨️ Imprimer</button><div class="invoice-page"><div class="header"><div class="company-info"><div class="company-name">MedCabin</div><div class="company-details" id="doctor-info">Dr. [Nom]<br>📞 0634602548<br>📧 abdellahdefaa23@gmail.com<br>📍 Fès, Maroc</div></div><div class="logo">⚕️</div></div><div class="invoice-title">FACTURE</div><div class="invoice-number" id="invoice-number">N° 2026-0001</div><div class="billing-section"><div><div class="section-title">Facturé à</div><div class="section-content" id="patient-info"></div></div><div><div class="section-title">Détails facture</div><div class="section-content" id="invoice-details"></div></div></div><div class="amount-section"><div class="amount-label">Montant total</div><div class="amount-value" id="total-amount">0.00 DH</div></div><div id="description-section" style="background:#fef3c7;padding:20px;border-radius:8px;border-left:4px solid #f59e0b;margin-bottom:40px;display:none"><div style="font-weight:bold;font-size:16px;color:#92400e;margin-bottom:10px">📋 Description</div><div id="description-text" style="font-size:14px;color:#78350f"></div></div><div class="footer">Merci pour votre confiance • Cette facture est un document officiel</div></div><script type="module">import{getCurrentUser}from'./supabase-client.js';import{getInvoiceById,formatAmount,formatInvoiceDate}from'./invoices-api.js';const id=new URLSearchParams(window.location.search).get('id');async function load(){if(!id){alert('Aucune facture');window.close();return}const r=await getInvoiceById(id);if(r.success){const i=r.invoice;const u=await getCurrentUser();document.getElementById('doctor-info').innerHTML=`Dr. ${u.user_metadata?.full_name||u.email.split('@')[0]}<br>📞 0634602548<br>📧 ${u.email}<br>📍 Fès, Maroc`;document.getElementById('invoice-number').textContent='N° '+i.numero_facture;document.getElementById('patient-info').innerHTML=`<strong>${i.patient.prenom} ${i.patient.nom}</strong><br>📞 ${i.patient.telephone}${i.patient.adresse?'<br>📍 '+i.patient.adresse:''}`;document.getElementById('invoice-details').innerHTML=`<strong>Date:</strong> ${formatInvoiceDate(i.date_facture)}<br><strong>Statut:</strong> ${i.statut}${i.mode_paiement?'<br><strong>Mode:</strong> '+i.mode_paiement:''}${i.date_paiement?'<br><strong>Payée le:</strong> '+formatInvoiceDate(i.date_paiement):''}`;document.getElementById('total-amount').textContent=formatAmount(i.montant);if(i.description){document.getElementById('description-section').style.display='block';document.getElementById('description-text').textContent=i.description}document.title=`Facture ${i.numero_facture}`}else{alert('Erreur');window.close()}}load()</script></body></html>
