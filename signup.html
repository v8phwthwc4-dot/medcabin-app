<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - MedCabin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 3rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: var(--gray);
            font-size: 0.95rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .password-strength {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
            width: 0%;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: #ef4444;
        }

        .password-strength-bar.medium {
            width: 66%;
            background: #f59e0b;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #10b981;
        }

        .password-hint {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 0.25rem;
        }

        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .form-checkbox input {
            width: 1.125rem;
            height: 1.125rem;
            cursor: pointer;
            margin-top: 0.125rem;
        }

        .form-checkbox label {
            font-size: 0.875rem;
            color: var(--gray);
            cursor: pointer;
            line-height: 1.5;
        }

        .form-checkbox label a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-checkbox label a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            padding: 1rem;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }

        .auth-footer p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">⚕️</div>
                <h1 class="auth-title">Créer un compte</h1>
                <p class="auth-subtitle">Essai gratuit 30 jours • Sans carte bancaire</p>
            </div>

            <div id="alert-container"></div>

            <form class="auth-form" id="signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="prenom">Prénom</label>
                        <input 
                            type="text" 
                            id="prenom" 
                            name="prenom"
                            class="form-input" 
                            placeholder="Mohammed"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="nom">Nom</label>
                        <input 
                            type="text" 
                            id="nom" 
                            name="nom"
                            class="form-input" 
                            placeholder="Alami"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Adresse email professionnelle</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        class="form-input" 
                        placeholder="dr.alami@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="telephone">Téléphone</label>
                        <input 
                            type="tel" 
                            id="telephone" 
                            name="telephone"
                            class="form-input" 
                            placeholder="0612345678"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="ville">Ville</label>
                        <select id="ville" name="ville" class="form-input" required>
                            <option value="">Sélectionner</option>
                            <option value="fes">Fès</option>
                            <option value="casablanca">Casablanca</option>
                            <option value="rabat">Rabat</option>
                            <option value="marrakech">Marrakech</option>
                            <option value="tanger">Tanger</option>
                            <option value="agadir">Agadir</option>
                            <option value="meknes">Meknès</option>
                            <option value="oujda">Oujda</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="cabinet">Nom du cabinet</label>
                    <input 
                        type="text" 
                        id="cabinet" 
                        name="cabinet"
                        class="form-input" 
                        placeholder="Cabinet Dr. Alami"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        class="form-input" 
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                    <div class="password-strength">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                    <p class="password-hint">Minimum 8 caractères</p>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        J'accepte les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="btn-text">Créer mon compte</span>
                    <span id="btn-spinner" style="display: none;">
                        <span class="loading-spinner"></span>
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
                <p style="margin-top: 1rem;"><a href="index.html">← Retour à l'accueil</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { signUp } from './supabase-client.js'

        const form = document.getElementById('signup-form')
        const submitBtn = document.getElementById('submit-btn')
        const btnText = document.getElementById('btn-text')
        const btnSpinner = document.getElementById('btn-spinner')
        const alertContainer = document.getElementById('alert-container')
        const passwordInput = document.getElementById('password')
        const strengthBar = document.getElementById('password-strength-bar')

        // Fonction pour afficher une alerte
        function showAlert(message, type = 'error') {
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    ${message}
                </div>
            `
            setTimeout(() => {
                alertContainer.innerHTML = ''
            }, 7000)
        }

        // Vérifier la force du mot de passe
        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value
            let strength = 0

            if (password.length >= 8) strength++
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++
            if (password.match(/[0-9]/)) strength++
            if (password.match(/[^a-zA-Z0-9]/)) strength++

            strengthBar.className = 'password-strength-bar'
            if (strength <= 2) strengthBar.classList.add('weak')
            else if (strength === 3) strengthBar.classList.add('medium')
            else strengthBar.classList.add('strong')
        })

        // Gestion du formulaire
        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            const formData = new FormData(form)
            const email = formData.get('email')
            const password = formData.get('password')
            const userData = {
                prenom: formData.get('prenom'),
                nom: formData.get('nom'),
                telephone: formData.get('telephone'),
                ville: formData.get('ville'),
                cabinet: formData.get('cabinet'),
                full_name: `${formData.get('prenom')} ${formData.get('nom')}`
            }

            // Validation
            if (password.length < 8) {
                showAlert('Le mot de passe doit contenir au moins 8 caractères')
                return
            }

            // Désactiver le bouton et afficher le spinner
            submitBtn.disabled = true
            btnText.style.display = 'none'
            btnSpinner.style.display = 'inline-block'

            try {
                const result = await signUp(email, password, userData)

                if (result.success) {
                    showAlert('Compte créé avec succès ! Vérifiez votre email pour confirmer votre inscription.', 'success')
                    setTimeout(() => {
                        window.location.href = 'login.html'
                    }, 3000)
                } else {
                    showAlert(result.error || 'Erreur lors de la création du compte')
                    submitBtn.disabled = false
                    btnText.style.display = 'inline-block'
                    btnSpinner.style.display = 'none'
                }
            } catch (error) {
                showAlert('Une erreur est survenue. Réessayez.')
                submitBtn.disabled = false
                btnText.style.display = 'inline-block'
                btnSpinner.style.display = 'none'
            }
        })
    </script>
</body>
</html>
